[package]
name = "custos-model"
version = "0.1.0"
edition = "2021"
publish = false
description = "AEGIS Custos internal model: entities with provenance, the data contract, and the NVIDIA-tool adapters (nsys, ncu, NVML, SASS). Needs no AEGIS and no NVIDIA tool to build or test."

# Standalone (the root Cargo.toml is an unrelated workspace).
[workspace]

[dependencies]
anyhow = "1"
csv = "~1.3"
# Same rusqlite as aegis-perf (0.32, bundled), so custos-perf links one SQLite.
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# NVML, loaded at run time (a build needs no NVIDIA software); the version src-tauri uses.
nvml-wrapper = { version = "0.11", optional = true }

[features]
# The NVML library backend (telemetry::TelemetryBackend for NvmlLib). Off by default:
# the tests use a recorded probe (the NVML mock).
nvml = ["dep:nvml-wrapper"]

[dev-dependencies]
regex = "1"
sha2 = "0.10"
