[package]
name = "custos-perf"
version = "0.1.0"
edition = "2021"
publish = false
description = "AEGIS Custos data layer: read-only views over the AEGIS Core perf DB, via aegis-perf"

# Standalone (the root Cargo.toml is an unrelated workspace).
[workspace]

[dependencies]
# AEGIS Core's perf DB library: schema, queries and roofline math (never the CLI).
# Pinned to a Core rev (project rules 22-23); bump it in its own commit.
aegis-perf = { git = "https://github.com/Riffe007/aegis-core", rev = "733f1b393ad68e276ad56e1f51a0442110dfa1da" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
